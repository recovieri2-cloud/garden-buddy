<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="potG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5A98C"/>
      <stop offset="100%" stop-color="#A86347"/>
    </linearGradient>
  </defs>

  <!-- 角丸の背景 -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- 太陽の薄い円 -->
  <circle cx="380" cy="135" r="56" fill="#FEF3C7" opacity="0.45"/>

  <!-- 葉っぱ（左の大きい） -->
  <ellipse cx="186" cy="208" rx="78" ry="34" fill="#10B981" transform="rotate(-30 186 208)"/>
  <ellipse cx="186" cy="208" rx="78" ry="34" fill="none" stroke="#047857" stroke-width="6" transform="rotate(-30 186 208)"/>
  <path d="M 130 230 Q 186 200 240 188" stroke="#047857" stroke-width="4" fill="none"/>

  <!-- 葉っぱ（右） -->
  <ellipse cx="328" cy="200" rx="68" ry="30" fill="#34D399" transform="rotate(28 328 200)"/>
  <ellipse cx="328" cy="200" rx="68" ry="30" fill="none" stroke="#047857" stroke-width="6" transform="rotate(28 328 200)"/>
  <path d="M 280 188 Q 328 196 376 218" stroke="#047857" stroke-width="4" fill="none"/>

  <!-- 茎 -->
  <path d="M 256 320 L 256 200" stroke="#047857" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- 真ん中の若芽 -->
  <ellipse cx="256" cy="172" rx="22" ry="36" fill="#10B981"/>
  <ellipse cx="256" cy="172" rx="22" ry="36" fill="none" stroke="#047857" stroke-width="6"/>

  <!-- 植木鉢 -->
  <path d="M 156 320 L 356 320 L 332 446 Q 330 460 316 460 L 196 460 Q 182 460 180 446 Z" fill="url(#potG)"/>
  <rect x="140" y="304" width="232" height="32" rx="10" fill="#D69377"/>
  <ellipse cx="256" cy="312" rx="116" ry="10" fill="#A86347"/>
</svg>
